<header class="top">
  <button
    class="menu-toggle"
    id="menuToggle"
    type="button"
    aria-label="Open navigation menu"
    aria-controls="sidebar"
    aria-expanded="false"
  >
    <span class="menu-bars" aria-hidden="true"></span>
    <span class="sr-only">Menu</span>
  </button>

  <a class="brand" href="{{ relURL "/" }}">{{ .Site.Title }}</a>

  <nav class="mount-nav">
    {{ range .Site.Mounts }}
      {{ if ne .Name "Home" }}
        <a class="mount-link {{ if eq .Name $.Params.mount }}active{{ end }}" href="{{ .UrlPrefix }}">{{ .Name }}</a>
      {{ end }}
    {{ end }}
  </nav>

  <a class="gh-link" href="https://github.com/tsoniclang/tsonic">GitHub</a>

  <div class="search">
    <input id="searchBox" type="search" placeholder="Search docs…" autocomplete="off" />
    <div id="searchResults" class="search-results"></div>
  </div>
</header>
