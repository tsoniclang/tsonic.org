<header class="site-header">
  <div class="header-inner">
    {{ if not .IsHome }}
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open documentation navigation" aria-controls="sidebar" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    {{ end }}

    <a class="wordmark" href="{{ relURL "/" }}" aria-label="Tsonic home">
      <span class="wordmark-symbol" aria-hidden="true">T</span>
      <span>Tsonic</span>
    </a>

    <nav class="primary-nav" aria-label="Primary navigation">
      <a href="{{ relURL "/docs/" }}">Docs</a>
      <a href="{{ relURL "/docs/manual/targets/csharp/" }}">C#</a>
      <a href="{{ relURL "/docs/manual/targets/rust/" }}">Rust</a>
    </nav>

    <div class="header-actions">
      {{ if not .IsHome }}
        <div class="search-wrap">
          <label class="sr-only" for="searchBox">Search documentation</label>
          <input id="searchBox" type="search" placeholder="Search docs" autocomplete="off" />
          <kbd>/</kbd>
          <div id="searchResults" class="search-results" hidden></div>
        </div>
      {{ end }}
      <a class="github-link" href="https://github.com/tsoniclang" aria-label="Tsonic on GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.16.08 1.78 1.2 1.78 1.2 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.57-.29-5.27-1.29-5.27-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.47.11-3.05 0 0 .97-.31 3.16 1.18a10.93 10.93 0 0 1 5.76 0c2.19-1.49 3.15-1.18 3.15-1.18.63 1.58.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.71 5.39-5.29 5.68.42.36.79 1.06.79 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z" /></svg>
        <span>GitHub</span>
      </a>
    </div>
  </div>
</header>
