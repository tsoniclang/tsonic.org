{{ if .Nav }}
  <nav class="nav">
    {{ range .Nav }}
      {{ if .IsSection }}
        <div class="nav-group">{{ .Title }}</div>
        <ul class="nav-items">
          {{ range .Children }}
            <li>
              <a class="nav-link {{ if eq .Url $.RelPermalink }}active{{ end }}" href="{{ .Url }}">{{ .Title }}</a>
            </li>
          {{ end }}
        </ul>
      {{ else }}
        <ul class="nav-items">
          <li>
            <a class="nav-link {{ if eq .Url $.RelPermalink }}active{{ end }}" href="{{ .Url }}">{{ .Title }}</a>
          </li>
        </ul>
      {{ end }}
    {{ end }}
  </nav>
{{ else }}
  <div class="sidebar-home">
    <div class="sidebar-title">{{ .Name }}</div>
    <ul>
      <li><a href="{{ .UrlPrefix }}">Overview</a></li>
    </ul>
  </div>
{{ end }}
