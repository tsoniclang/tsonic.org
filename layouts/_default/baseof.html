<!doctype html>
<html lang="{{ .Site.LanguageCode }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    <meta name="description" content="{{ default .Site.Title .Description }}" />
    <link rel="stylesheet" href="{{ relURL "docs.css" }}" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
      referrerpolicy="no-referrer"
    />
    <script defer src="{{ relURL "search.js" }}"></script>
    <script defer src="{{ relURL "nav.js" }}"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" referrerpolicy="no-referrer"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/typescript.min.js" referrerpolicy="no-referrer"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js" referrerpolicy="no-referrer"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js" referrerpolicy="no-referrer"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js" referrerpolicy="no-referrer"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/csharp.min.js" referrerpolicy="no-referrer"></script>
    <script defer src="{{ relURL "highlight-init.js" }}"></script>
  </head>
  <body>
    {{ partial "header.html" . }}
    <div id="sidebarOverlay" class="sidebar-overlay" aria-hidden="true"></div>
    <div class="layout">
      <aside id="sidebar" class="sidebar" aria-label="Site navigation">
        <div class="sidebar-mobile-top">
          <button class="menu-close" id="menuClose" type="button" aria-label="Close navigation menu">
            Close
          </button>
        </div>
        <div class="sidebar-inner">{{ partial "sidebar.html" . }}</div>
      </aside>
      <main class="main">{{ block "main" . }}{{ end }}</main>
    </div>
    {{ partial "footer.html" . }}
  </body>
</html>
