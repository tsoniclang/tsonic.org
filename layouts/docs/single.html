{{ define "main" }}
<article class="doc-article">
  <div class="doc-toolbar">
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      {{ range .Ancestors }}
        {{ if not .IsHome }}<a href="{{ .RelPermalink }}">{{ .Title }}</a><span aria-hidden="true">/</span>{{ end }}
      {{ end }}
      <span>{{ .Title }}</span>
    </nav>
    {{ with .Params.editURL }}<a class="edit-link" href="{{ . }}">Edit source</a>{{ end }}
  </div>
  <div class="prose">{{ .Content }}</div>
</article>
{{ end }}
