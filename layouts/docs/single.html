{{ define "main" }}
<article class="doc">
  <div class="doc-top">
    <nav class="breadcrumbs">
      {{ range .Ancestors }}
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        <span class="sep">/</span>
      {{ end }}
      <span>{{ .Title }}</span>
    </nav>
    {{ with .Params.editURL }}<a class="edit" href="{{ . }}">Edit on GitHub</a>{{ end }}
  </div>

  <div class="content">{{ .Content }}</div>
</article>
{{ end }}
