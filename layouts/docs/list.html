{{ define "main" }}
<article class="doc">
  <div class="doc-top">
    <nav class="breadcrumbs">
      {{ range .Ancestors }}
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        <span class="sep">/</span>
      {{ end }}
      <span>{{ .Title }}</span>
    </nav>
    {{ with .Params.editURL }}<a class="edit" href="{{ . }}">Edit on GitHub</a>{{ end }}
  </div>

  {{ with .Content }}<div class="content">{{ . }}</div>{{ else }}<h1 class="page-title">{{ .Title }}</h1>{{ end }}

  {{ if .Pages }}
    <ul class="page-list">
      {{ range .Pages }}
        <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
      {{ end }}
    </ul>
  {{ end }}
</article>
{{ end }}
