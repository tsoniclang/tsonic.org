{{ define "main" }}
<article class="doc-article">
  <div class="doc-toolbar">
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      {{ range .Ancestors }}
        {{ if not .IsHome }}<a href="{{ .RelPermalink }}">{{ .Title }}</a><span aria-hidden="true">/</span>{{ end }}
      {{ end }}
      <span>{{ .Title }}</span>
    </nav>
    {{ with .Params.editURL }}<a class="edit-link" href="{{ . }}">Edit source</a>{{ end }}
  </div>

  {{ with .Content }}<div class="prose">{{ . }}</div>{{ else }}<div class="prose"><h1>{{ .Title }}</h1></div>{{ end }}

  {{ if .Pages }}
    <div class="section-pages">
      {{ range .Pages }}
        <a href="{{ .RelPermalink }}"><strong>{{ .Title }}</strong><span aria-hidden="true">→</span></a>
      {{ end }}
    </div>
  {{ end }}
</article>
{{ end }}
